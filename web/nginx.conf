server {
    listen 80;
    server_name _;

    # Enable gzip compression for performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Serve static files with caching and compression
    location ~* \.(jpg|jpeg|png|css|js|webp|svg|ttf|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Proxy API requests to the internal api service (compose DNS).
    # Variable + Docker resolver so nginx re-resolves after api restarts.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream api:5000;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle the root path and Single Page Application (SPA) fallback
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}

